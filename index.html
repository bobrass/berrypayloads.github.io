<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PS4 11.00 Mod Menus</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(
                circle at 50% 20%,
                rgba(0, 90, 190, 0.22),
                transparent 45%
            ),
            #0b0d14;

        color: white;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        flex-direction: column;
    }

    /* Background waves */

    .wave {
        position: fixed;
        z-index: -1;

        width: 140%;
        height: 180px;

        left: -20%;

        background: linear-gradient(
            90deg,
            transparent,
            rgba(0, 80, 220, 0.13),
            transparent
        );

        border-top: 1px solid rgba(0, 120, 255, 0.25);

        transform: rotate(-7deg);
    }

    .wave.one {
        top: 180px;
    }

    .wave.two {
        top: 500px;
        transform: rotate(7deg);
    }

    /* Header */

    header {
        padding: 35px 20px 20px;
        text-align: center;
    }

    .ps4 {
        position: absolute;
        left: 35px;
        top: 30px;

        font-size: 30px;
        letter-spacing: 4px;
        font-weight: 300;
    }

    h1 {
        margin: 0;

        font-size: 30px;
        font-weight: 500;
    }

    .subtitle {
        margin-top: 10px;

        color: #75baff;
        font-size: 17px;
    }

    .line {
        width: 450px;
        max-width: 80%;

        height: 2px;

        margin: 15px auto;

        background: linear-gradient(
            90deg,
            transparent,
            #008cff,
            white,
            #008cff,
            transparent
        );

        box-shadow: 0 0 12px #008cff;
    }

    /* Main */

    main {
        flex: 1;

        width: 100%;
        max-width: 850px;

        margin: auto;

        padding: 20px;
    }

    .status-title {
        text-align: center;

        font-size: 19px;
        font-weight: bold;

        margin-bottom: 10px;
    }

    #status {
        text-align: center;

        min-height: 30px;

        margin-bottom: 30px;

        color: #8ebde8;

        font-size: 14px;
    }

    /* Buttons */

    .buttons {
        display: grid;

        grid-template-columns: repeat(2, 1fr);

        gap: 15px;
    }

    button {
        min-height: 90px;

        border-radius: 12px;

        border: 1px solid #007cff;

        background:
            linear-gradient(
                180deg,
                rgba(10, 55, 110, 0.95),
                rgba(3, 18, 40, 0.98)
            );

        color: white;

        font-size: 20px;
        font-weight: bold;

        cursor: pointer;

        box-shadow:
            0 0 10px rgba(0, 120, 255, 0.25),
            inset 0 0 15px rgba(0, 100, 255, 0.12);

        transition: 0.15s ease;
    }

    button:hover {
        background:
            linear-gradient(
                180deg,
                #087fe5,
                #06447e
            );

        border-color: #00aaff;

        box-shadow:
            0 0 20px rgba(0, 150, 255, 0.65);

        transform: translateY(-2px);
    }

    button:active {
        transform: scale(0.97);
    }

    /* Footer */

    footer {
        text-align: center;

        padding: 25px;

        border-top: 1px solid rgba(0, 120, 255, 0.3);

        color: #66819e;

        font-size: 13px;
    }

    .blue {
        color: #4daaff;
    }

    /* Mobile */

    @media (max-width: 600px) {

        .ps4 {
            position: static;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 25px;
        }

        .buttons {
            grid-template-columns: 1fr;
        }

        button {
            min-height: 75px;
        }
    }
</style>
</head>

<body>

<div class="wave one"></div>
<div class="wave two"></div>


<header>

    <div class="ps4">
        PS4
    </div>

    <h1>
        PS4 11.00 Mod Menu Host
    </h1>

    <div class="subtitle">
        Black Ops III &nbsp; / &nbsp; Black Ops 4
    </div>

    <div class="line"></div>

</header>


<main>

    <div class="status-title">
        Status
    </div>

    <div id="status">
        Ready — select a mod menu
    </div>


    <div class="buttons">

        <button onclick="loadPayload('payloads/bo3.bin')">
            🎮<br>
            BO3 Mod Menu
        </button>


        <button onclick="loadPayload('payloads/bo4.bin')">
            🎮<br>
            BO4 Mod Menu
        </button>

    </div>

</main>


<footer>

    <span class="blue">PS4 11.00</span>
    &nbsp; • &nbsp;
    Black Ops Mod Menu Host

</footer>


<script>

async function loadPayload(file) {

    const status =
        document.getElementById("status");

    status.textContent =
        "Loading " + file + "...";

    try {

        const response =
            await fetch(file);

        if (!response.ok) {
            throw new Error("Payload not found");
        }

        const data =
            await response.arrayBuffer();

        console.log(
            "Loaded:",
            file,
            data.byteLength,
            "bytes"
        );

        status.textContent =
            "Loaded " +
            file +
            " (" +
            data.byteLength +
            " bytes)";

        /*
         * Connect your PS4 11.00 exploit's
         * payload-sending function here.
         *
         * GitHub Pages hosts the .bin files;
         * it doesn't execute them by itself.
         */

    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;
    }
}

</script>

</body>
</html>
